name: Build Windows Electron installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "apps/packaged/**"
      - "apps/daemon/**"
      - "apps/web/**"
      - "packages/**"
      - "tools/pack/**"
      - "assets/**"
      - "craft/**"
      - "data/plugin-previews/**"
      - "design-systems/**"
      - "design-templates/**"
      - "plugins/**"
      - "prompt-templates/**"
      - "skills/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-electron.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "apps/packaged/**"
      - "apps/daemon/**"
      - "apps/web/**"
      - "packages/**"
      - "tools/pack/**"
      - "assets/**"
      - "craft/**"
      - "data/plugin-previews/**"
      - "design-systems/**"
      - "design-templates/**"
      - "plugins/**"
      - "prompt-templates/**"
      - "skills/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-electron.yml"

permissions:
  contents: read

concurrency:
  group: build-electron-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  win_x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup NSIS
        shell: pwsh
        run: |
          function Test-Makensis {
            [bool]((Get-Command makensis.exe -ErrorAction SilentlyContinue) -or (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe"))
          }
          if (Test-Makensis) { Write-Host "makensis already present"; exit 0 }
          foreach ($attempt in 1..4) {
            Write-Host "choco install nsis (attempt $attempt)"
            choco install nsis -y --no-progress
            if (Test-Makensis) { break }
            Start-Sleep -Seconds (15 * $attempt)
          }
          if (-not (Test-Makensis)) {
            Write-Error "NSIS install failed after 4 attempts: makensis absent from PATH and C:\Program Files (x86)\NSIS"
            exit 1
          }
          Write-Host "NSIS ready"
      - name: Resolve app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build Windows installer
        shell: pwsh
        run: |
          pnpm.cmd exec tools-pack win build `
            --namespace build-electron-win `
            --portable `
            --app-version "${{ steps.version.outputs.version }}" `
            --to nsis `
            --json
          if ($LASTEXITCODE -ne 0) { throw "Windows Electron build failed" }
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeck-windows-x64
          path: .tmp/tools-pack/out/win/namespaces/build-electron-win/builder/*.exe
          if-no-files-found: error
          retention-days: 14
